name: lerviz-api-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ephemeral-test-root
      MYSQL_DATABASE: lerviz_api_test
      MYSQL_USER: lerviz_test
      MYSQL_PASSWORD: ephemeral-test-only
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=ephemeral-test-only mysql -h 127.0.0.1 -u lerviz_test lerviz_api_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
