name: shared-dev-data

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup.mjs first}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: lerviz
      MYSQL_USER: lerviz_app
      MYSQL_PASSWORD: ${LERVIZ_DB_PASSWORD:?Run setup.mjs first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      data:
        aliases:
          - shared-mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    environment:
      PMA_HOST: shared-mysql
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

volumes:
  mysql_data:
    name: shared-dev-mysql-data

networks:
  data:
    name: shared-dev-data
