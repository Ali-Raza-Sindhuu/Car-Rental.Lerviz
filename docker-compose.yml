services:
  postgres:
    image: postgres:16-alpine
    container_name: car_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-car_rental_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_rental_super_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-car_rental_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_rental_user} -d ${POSTGRES_DB:-car_rental_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - car_rental_net

  redis:
    image: redis:7-alpine
    container_name: car_rental_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - car_rental_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: car_rental_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-car_rental_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-car_rental_super_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-car_rental_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password}
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - car_rental_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: car_rental_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - car_rental_net

volumes:
  postgres_data:
  redis_data:

networks:
  car_rental_net:
    driver: bridge