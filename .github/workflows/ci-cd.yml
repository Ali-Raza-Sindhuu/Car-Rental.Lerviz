name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/car-rental-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/car-rental-frontend

jobs:
  # --------------------------------------------------------------------------
  # 1. Continuous Integration (Tests & Quality Checks)
  # --------------------------------------------------------------------------
  lint-and-test:
    name: Code Verification & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Test
        run: |
          cd Frontend
          npm ci
          npm run build

  # --------------------------------------------------------------------------
  # 2. Build & Push Docker Images to GitHub Container Registry (GHCR)
  # --------------------------------------------------------------------------
  build-and-push-images:
    name: Build & Push Production Docker Images
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  # --------------------------------------------------------------------------
  # 3. Continuous Deployment (Automated Rollout to Live Server)
  # --------------------------------------------------------------------------
  deploy-to-production:
    name: Deploy to Live Server
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Navigate to production project directory
            mkdir -p ~/app/car-rental
            cd ~/app/car-rental

            # Log into GitHub Container Registry on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest production images
            docker compose -f docker-compose.prod.yml pull

            # Run zero-downtime rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old unused Docker images to conserve disk space
            docker image prune -af --filter "until=72h"

            echo "Deployment finished successfully!"