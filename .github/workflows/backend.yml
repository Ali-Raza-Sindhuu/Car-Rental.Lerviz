name: Backend checks
on:
  push:
    paths: ['Backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['Backend/**', '.github/workflows/backend.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-test-root
          MYSQL_DATABASE: lerviz_api_test
          MYSQL_USER: lerviz_test
          MYSQL_PASSWORD: ephemeral-test-only
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://lerviz_test:ephemeral-test-only@127.0.0.1:3307/lerviz_api_test
      TEST_DATABASE_URL: mysql://lerviz_test:ephemeral-test-only@127.0.0.1:3307/lerviz_api_test
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: docker build -t lerviz-api:test .
      - run: docker run --rm --network host -e DATABASE_URL --mount type=bind,source="$PWD/test/docker-smoke.cjs",target=/app/smoke.cjs,readonly lerviz-api:test node /app/smoke.cjs
