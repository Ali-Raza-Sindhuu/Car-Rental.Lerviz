name: Backend CI
on:
  push:
    paths: ['Backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['Backend/**', '.github/workflows/backend.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://car_rental:local-ci-password@localhost:5432/car_rental_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: car_rental
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: car_rental_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U car_rental -d car_rental_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://car_rental:local-ci-password@localhost:5432/car_rental_test?schema=public
